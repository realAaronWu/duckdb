name: Validate 26856 final Windows CLI
on:
  push:
    branches: [codex/validate-26856-windows347]
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GEN: ninja
      CC: clang-cl
      CXX: clang-cl
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2842103afa049050ae1d357f532d96850283ee86
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/ccache-action
        with:
          key: win-release-64
      - uses: ./.github/actions/setup-msvc-env
      - name: Record legacy Windows encoding and source identity
        shell: bash
        run: |
          mkdir evidence
          clang-cl --version | tee evidence/compiler.txt
          git rev-parse HEAD | tee evidence/source.txt
          python -c "import locale,os,platform; print(platform.platform(),os.cpu_count(),os.getenv('ImageVersion')); print(locale.getpreferredencoding(False)); assert locale.getpreferredencoding(False).lower() == 'cp1252'" | tee evidence/encoding.txt
      - name: Build unchanged final production source
        shell: bash
        run: |
          python scripts/windows_ci.py
          make windows_release > evidence/build.log 2>&1
          ./duckdb.exe -version | tee evidence/version.txt
          sha256sum duckdb.exe test/unittest.exe > evidence/binaries.sha256
          git diff > evidence/build-patch.diff
      - name: Complete final CLI suite under cp1252
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest tools/shell/tests --shell-binary duckdb.exe -q > evidence/cli.log 2>&1
          cat evidence/cli.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-284-cli-evidence
          path: evidence
          if-no-files-found: error
